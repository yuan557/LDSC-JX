[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ldsc-jx"
version = "0.1.0"
description = "GPU-accelerated LD Score Regression in JAX"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "jaxlib",
    "numpy",
    "pandas",
    "scipy",
    "bed-reader",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]"]
test = ["pytest"]

[project.scripts]
ldsc-jx = "ldsc_jx.cli:main"
